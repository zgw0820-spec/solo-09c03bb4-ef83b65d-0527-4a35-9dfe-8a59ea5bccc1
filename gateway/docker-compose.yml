# Cold-storage gateway: collector hot-swap with TCP fd handover.
#
#   gateway  - supervisor + FastAPI operation page (8000) and the two
#              recorder-facing TCP entries:
#                primary :9000
#                backup  :9001
#              Collector generations run as child processes inside this same
#              container so they can exchange connection fds over Unix
#              sockets (SCM_RIGHTS). The dual-entry simulated recorder races
#              both entries and sends its batch over the first ready one.
#   recorder - optional standalone simulated recorder, profile "recorder".
#              The web page can also start an in-container recorder.
services:
  gateway:
    build: .
    image: coldstore-gateway:latest
    container_name: coldstore-gateway
    ports:
      - "8000:8000"   # operation page: http://localhost:8000/
      - "9000:9000"   # primary recorder TCP entry (newline JSON readings)
      - "9001:9001"   # backup recorder TCP entry
    environment:
      GATEWAY_WEB_PORT: "8000"
      GATEWAY_TCP_PORT: "9000"
      GATEWAY_BACKUP_TCP_PORT: "9001"
      COLLECTOR_INITIAL_VERSION: "v1"
      COLLECTOR_FAIL_PATH: "/var/run/gateway/collector-fail"
    tmpfs:
      - /var/run/gateway
    restart: unless-stopped

  # Standalone recorder on the compose network:
  #   legacy single entry:
  #     docker compose --profile recorder run --rm recorder \
  #       python -m app.recorder --mode single --host gateway --port 9000 \
  #       --count 60 --gap-at 20
  #   dual entry race (primary delayed 3s, backup ready):
  #     docker compose --profile recorder run --rm recorder \
  #       python -m app.recorder --mode dual --host gateway --port 9000 \
  #       --backup-port 9001 --count 60 --failover-after 1 --total-timeout 8
  recorder:
    image: coldstore-gateway:latest
    build: .
    profiles: ["recorder"]
    depends_on:
      - gateway
    entrypoint: ["python"]
    command: ["-c", "import time; time.sleep(3600)"]
